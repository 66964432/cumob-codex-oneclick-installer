# Portable subset of the current Codex configuration.
# The installer fills in the catalog path and derives the default model from that catalog.

model_provider = "cumob"
model = "{{DEFAULT_MODEL}}"
disable_response_storage = true
model_catalog_json = "{{MODEL_CATALOG_PATH}}"
model_reasoning_effort = "{{DEFAULT_REASONING_LEVEL}}"

[model_providers.cumob]
name = "cumob"
wire_api = "responses"
image_api = "images"
image_model = "gpt-image-2.5"
video_api = "videos"
video_model = "minimax-h3-2k"
requires_openai_auth = true
# Both api.cumob.com and api.cumob.cn are valid CUMOB endpoints.
base_url = "{{CUMOB_BASE_URL}}"
