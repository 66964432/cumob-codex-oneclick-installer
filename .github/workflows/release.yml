name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run installer tests
        run: bash tests/test-install.sh

      - name: Build release artifacts
        run: bash build-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cumob-codex-oneclick-installer.zip
            dist/bootstrap-entry.zip
            dist/install-macos.command
            dist/install-windows.cmd
            MANIFEST.sha256
          generate_release_notes: true
